# Dagelijkse run online (besluit 47): dezelfde `epv daily` als lokaal, data bewaard op de branch `data`, site naar GitHub Pages.
#
# Tijden in UTC (GitHub kent geen zomertijd). De day-ahead prijzen komen rond 13:00-14:00 Nederlandse tijd bij
# Energy-Charts binnen. Daarom vijf pogingen met `--type middag` (besluit 54): alleen de eerste poging waarin de prijzen
# voor morgen binnen zijn doet een hoofdrun, de andere stoppen meteen. Verversingen (`--type auto`) rond 19:00, 01:00 en
# 07:00 lokaal (besluit 33).
#
#   UTC    winter  zomer
#   11:20  12:20   13:20
#   11:40  12:40   13:40
#   12:20  13:20   14:20
#   12:40  13:40   14:40
#   13:20  14:20   15:20  (laatste herkansing)
name: dagelijkse run

on:
  schedule:
    - cron: "20 11 * * *"
    - cron: "40 11 * * *"
    - cron: "20 12 * * *"
    - cron: "40 12 * * *"
    - cron: "20 13 * * *"
    - cron: "5 18 * * *"    # verversing avond
    - cron: "5 0 * * *"     # verversing nacht
    - cron: "5 6 * * *"     # verversing ochtend
  workflow_dispatch:
    inputs:
      type:
        description: "auto, hoofd, verversing of middag"
        default: auto

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Amsterdam
    outputs:
      overgeslagen: ${{ steps.run.outputs.overgeslagen }}
    steps:
      - uses: actions/checkout@v7

      - name: Data van de vorige run ophalen (branch data)
        run: |
          git fetch origin data:refs/remotes/origin/data || echo "nog geen data-branch; eerste run haalt alles op"
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            for pad in data/raw data/processed data/runs models; do
              git restore --source=origin/data --worktree -- "$pad" || echo "$pad niet op de data-branch"
            done
            git reset -q
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeren
        run: pip install -e ".[model]"

      - name: Run
        id: run
        run: |
          set -o pipefail
          TYPE="${{ github.event.inputs.type }}"
          if [ -z "$TYPE" ]; then
            case "${{ github.event.schedule }}" in
              "5 "*) TYPE=auto ;;      # verversingen
              *)     TYPE=middag ;;    # pogingen rond de day-ahead publicatie
            esac
          fi
          echo "type: $TYPE"
          # een verversing wacht bij een storing van de weerbron: drie rondes met 20 minuten ertussen (besluit 78)
          epv daily --type "$TYPE" --weer-rondes 3 --weer-wacht 20 | tee run.log
          if grep -q "^run overgeslagen" run.log; then echo "overgeslagen=true" >> "$GITHUB_OUTPUT"; fi

      - name: Data bewaren op branch data (één commit, geen geschiedenis)
        if: steps.run.outputs.overgeslagen != 'true'
        run: |
          git config user.name "stroomprijsvoorspeller-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan data-nieuw
          git rm -rfq --cached .
          git add -f data/raw data/processed/features.parquet data/processed/voorspellingen_historie.parquet data/runs models || true
          git add -f data/processed/*.parquet || true
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin data-nieuw:data

      - uses: actions/configure-pages@v6
        if: steps.run.outputs.overgeslagen != 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.run.outputs.overgeslagen != 'true'
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.overgeslagen != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
