# Dagelijkse run online (besluit 47): dezelfde `epv daily` als lokaal, data bewaard op de branch `data`, site naar GitHub Pages.
#
# De day-ahead veiling sluit om 12:00 Nederlandse tijd; de uitslag komt vanaf 12:57 en bij vertraging uiterlijk 14:20
# (noodprocedure van de marktkoppeling). ENTSO-E hoort de prijzen binnen een uur na sluiting te tonen. Daarom pogingen
# met `--type middag` (besluit 54 en 84) om 10 en 30 over het uur, van 13:10 tot 15:10 lokaal: alleen de eerste poging
# waarin de prijzen voor morgen binnen zijn doet een hoofdrun, de andere stoppen meteen. De pogingen vanaf 15:00 geven
# ook EnergyZero een kans (besluit 82). Verversingen (`--type auto`) rond 19:00, 01:00 en 07:00 lokaal (besluit 33).
#
# Tijden in UTC (GitHub kent geen zomertijd), dus elk tijdstip staat er voor beide seizoenen in. Een poging voor het
# publicatiemoment (in de winter de eerste twee) stopt meteen.
#
#   UTC    winter  zomer
#   11:10  12:10   13:10
#   11:30  12:30   13:30
#   12:10  13:10   14:10
#   12:30  13:30   14:30
#   13:10  14:10   15:10
#   13:30  14:30   15:30
#   14:10  15:10   16:10
#
# Let op: een tijd die met minuut 5 begint telt hieronder als verversing. Geef een middagpoging dus een andere minuut.
name: dagelijkse run

on:
  schedule:
    - cron: "10 11 * * *"
    - cron: "30 11 * * *"
    - cron: "10 12 * * *"
    - cron: "30 12 * * *"
    - cron: "10 13 * * *"
    - cron: "30 13 * * *"
    - cron: "10 14 * * *"
    - cron: "5 18 * * *"    # verversing avond
    - cron: "5 0 * * *"     # verversing nacht
    - cron: "5 6 * * *"     # verversing ochtend
  workflow_dispatch:
    inputs:
      type:
        description: "auto, hoofd, verversing of middag"
        default: auto

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Amsterdam
    outputs:
      overgeslagen: ${{ steps.run.outputs.overgeslagen }}
    steps:
      - uses: actions/checkout@v7

      - name: Data van de vorige run ophalen (branch data)
        run: |
          git fetch origin data:refs/remotes/origin/data || echo "nog geen data-branch; eerste run haalt alles op"
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            for pad in data/raw data/processed data/runs models; do
              git restore --source=origin/data --worktree -- "$pad" || echo "$pad niet op de data-branch"
            done
            git reset -q
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeren
        run: pip install -e ".[model]"

      - name: Run
        id: run
        env:
          # ENTSO-E is de hoofdbron voor de prijzen (besluit 83). Zonder dit secret is de waarde leeg en neemt
          # Energy-Charts het over.
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          set -o pipefail
          TYPE="${{ github.event.inputs.type }}"
          if [ -z "$TYPE" ]; then
            case "${{ github.event.schedule }}" in
              "5 "*) TYPE=auto ;;      # verversingen
              *)     TYPE=middag ;;    # pogingen rond de day-ahead publicatie
            esac
          fi
          echo "type: $TYPE"
          # bij een storing van de weerbron wacht de run: drie rondes met 20 minuten ertussen (besluit 78)
          epv daily --type "$TYPE" --weer-rondes 3 --weer-wacht 20 | tee run.log
          if grep -q "^run overgeslagen" run.log; then echo "overgeslagen=true" >> "$GITHUB_OUTPUT"; fi

      - name: Data bewaren op branch data (één commit, geen geschiedenis)
        if: steps.run.outputs.overgeslagen != 'true'
        run: |
          git config user.name "stroomprijsvoorspeller-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan data-nieuw
          git rm -rfq --cached .
          git add -f data/raw data/processed/features.parquet data/processed/voorspellingen_historie.parquet data/runs models || true
          git add -f data/processed/*.parquet || true
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin data-nieuw:data

      - uses: actions/configure-pages@v6
        if: steps.run.outputs.overgeslagen != 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.run.outputs.overgeslagen != 'true'
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.overgeslagen != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
