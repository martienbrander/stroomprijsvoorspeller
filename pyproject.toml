[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stroomprijsvoorspeller"
version = "0.1.0"
description = "Open voorspeller van de Nederlandse day-ahead stroomprijs, tot 5 dagen vooruit, met onzekerheidsmarge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "pyyaml>=6",
    "holidays>=0.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
model = ["lightgbm>=4.3", "scikit-learn>=1.4", "statsmodels>=0.14", "scipy>=1.11", "matplotlib>=3.8", "joblib>=1.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
epv = "stroomprijsvoorspeller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
